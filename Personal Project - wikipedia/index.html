<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep's Wiki</title>
<style>
  :root {
    --bg: #0f1012;
    --panel: #15171a;
    --panel-2: #1b1e22;
    --line: #2a2e34;
    --text: #e6e4df;
    --muted: #8d939b;
    --faint: #5c6269;
    --accent: #8a9bb0;
    --accent-soft: #b5c2d1;
    --accent-dim: rgba(138, 155, 176, 0.12);
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); line-height: 1.65;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    /* faint neural-network pattern */
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><g stroke='rgba(138,155,176,0.07)' stroke-width='1' fill='none'><path d='M25 40 L110 22 L190 70 L140 150 L60 120 Z M110 22 L60 120 M190 70 L205 190 L140 150 M60 120 L35 195 L140 150'/></g><g fill='rgba(138,155,176,0.13)'><circle cx='25' cy='40' r='2.5'/><circle cx='110' cy='22' r='2'/><circle cx='190' cy='70' r='2.5'/><circle cx='140' cy='150' r='3'/><circle cx='60' cy='120' r='2'/><circle cx='205' cy='190' r='2'/><circle cx='35' cy='195' r='2.5'/></g></svg>");
    background-attachment: fixed;
  }
  a { color: var(--accent-soft); text-decoration: none; }
  a:hover { color: #fff; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; padding: 12px 28px;
    background: rgba(15, 16, 18, 0.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: flex; align-items: center; gap: 10px; color: var(--text);
    font-family: var(--serif); font-size: 21px; white-space: nowrap;
  }
  .logo svg { color: var(--accent); }
  .logo em { color: var(--accent-soft); }
  .search {
    flex: 1; max-width: 560px; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 15px; outline: none;
  }
  .search::placeholder { color: var(--faint); }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .btn {
    padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 60px); }
  aside {
    border-right: 1px solid var(--line); background: rgba(21, 23, 26, 0.85);
    position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; padding: 16px 14px 40px;
  }
  main { padding: 30px 44px 70px; max-width: 1000px; }

  /* Sidebar tabs */
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 6px 4px; border: none; border-radius: 6px; background: transparent;
    color: var(--muted); font-size: 12.5px; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .group { margin-bottom: 2px; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: none; border-radius: 6px;
    background: transparent; color: var(--text); font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer;
  }
  .group-head:hover { background: var(--accent-dim); }
  .caret { color: var(--faint); font-size: 10px; transition: transform .15s; width: 10px; }
  .group-head.open .caret { transform: rotate(90deg); color: var(--accent); }
  .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); font-weight: 400; }
  .group-body { margin: 2px 0 8px 13px; padding-left: 8px; border-left: 1px solid var(--line); }
  .nav-item {
    display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; border-radius: 6px;
    color: var(--text); font-size: 13.5px;
  }
  .nav-item:hover { background: var(--accent-dim); color: #fff; }
  .nav-item.active { background: var(--accent-dim); color: var(--accent-soft); }
  .nav-item.empty { color: var(--faint); }
  .nav-item.story { font-size: 12.5px; color: var(--muted); padding-left: 20px; position: relative; }
  .nav-item.story::before { content: "◦"; position: absolute; left: 8px; color: var(--accent); }
  .nav-item.story.active { color: var(--accent-soft); }
  .side-note { font-size: 12px; color: var(--faint); padding: 4px 8px 10px; }
  .book-search {
    width: 100%; margin-bottom: 12px; padding: 8px 12px; border-radius: 7px; font-size: 13.5px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none;
  }
  .book-search::placeholder { color: var(--faint); }
  .book-search:focus { border-color: var(--accent); }
  .nav-shelf { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* Common text */
  .eyebrow { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); margin: 0 0 4px; }
  .eyebrow a { color: var(--accent); }
  .eyebrow a:hover { color: #fff; }
  .page-title { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.25; margin: 0 0 4px; }
  .page-sub { color: var(--muted); margin: 0 0 22px; }
  .section-title { font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 34px 0 4px; }
  .empty { color: var(--faint); padding: 14px 0; font-style: italic; }

  /* Chips */
  .chip {
    display: inline-block; padding: 2px 11px; margin: 0 6px 6px 0; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 12.5px;
  }
  .chip:hover { border-color: var(--accent); color: #fff; }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; color: var(--text); transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); color: var(--text); }
  .card h4 { font-family: var(--serif); font-weight: 500; margin: 0 0 6px; font-size: 17.5px; line-height: 1.35; }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .card .src { font-family: var(--mono); font-size: 11px; color: var(--accent); }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, rgba(138, 155, 176, 0.10), transparent 55%), var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px; margin-bottom: 8px;
  }
  .hero h1 { font-family: var(--serif); font-weight: 500; margin: 0 0 6px; font-size: 31px; }
  .hero h1 em { color: var(--accent-soft); }
  .hero p { margin: 0 0 18px; color: var(--muted); }
  .stats { display: flex; gap: 34px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 26px; }
  .stat span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* Shelves */
  .shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; }
  .shelf {
    display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    color: var(--text);
  }
  .shelf:hover { border-color: var(--accent); color: var(--text); }
  .shelf h4 { margin: 0 0 4px; font-size: 14.5px; }
  .shelf .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .shelf .meta b { color: var(--accent-soft); font-weight: 400; }
  .book-block { margin-bottom: 26px; }
  .book-block h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0 0 2px; }
  .book-block .author { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .not-yet { margin-top: 30px; padding: 14px 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; }
  .not-yet b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); font-weight: 400; display: block; margin-bottom: 4px; }

  /* Article */
  .meta-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .badge { font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  .badge.unverified { color: #c2a878; border-color: rgba(194, 168, 120, 0.35); }
  .badge.verified { color: #8fae95; border-color: rgba(143, 174, 149, 0.4); }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px 40px; }
  article h1 { font-family: var(--serif); font-weight: 500; margin-top: 0; font-size: 31px; line-height: 1.25; }
  article h2 {
    font-family: var(--mono); font-weight: 400; font-size: 12px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--accent); margin: 30px 0 8px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  article p, article li { font-size: 16px; }
  article strong { color: #fff; font-weight: 600; }
  article ul { padding-left: 22px; }
  article li::marker { color: var(--accent); }
  article blockquote { margin: 0 0 12px; padding-left: 14px; border-left: 2px solid var(--accent); color: var(--muted); }
  article .hook { font-family: var(--serif); font-size: 19px; border-left: 2px solid var(--accent); padding: 4px 0 4px 16px; }
  article .aha {
    font-family: var(--serif); font-size: 20px; text-align: center; padding: 20px;
    background: var(--accent-dim); border-radius: 10px;
  }
  article h3 { font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 26px 0 6px; line-height: 1.3; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .toc .chip { cursor: pointer; font-family: inherit; }
  .wikilink { border-bottom: 1px dotted var(--accent); }
  .wikilink.missing { color: var(--muted); border-bottom-color: var(--faint); cursor: help; }
  .tags-block { margin-top: 24px; padding-top: 6px; border-top: 1px solid var(--line); }
  .tags-block h5 { margin: 14px 0 8px; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 22px 18px; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    article { padding: 22px 20px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 6c-2-2-6-1.5-6.5 1.5C6 8 5 10.5 6 12.5c-2 1.5-2 5 0 6.5-1 2.5 1 5 3.5 5 .5 2.5 4 3 5.5 1V6z"/>
      <path d="M17 6c2-2 6-1.5 6.5 1.5C26 8 27 10.5 26 12.5c2 1.5 2 5 0 6.5 1 2.5-1 5-3.5 5-.5 2.5-4 3-5.5 1V6z"/>
      <path d="M9.5 12.5c1.5 0 2.5 1 2.5 2.5M22.5 12.5c-1.5 0-2.5 1-2.5 2.5M9.5 19.5c1.5-.5 3 0 3.5 1.5M22.5 19.5c-1.5-.5-3 0-3.5 1.5"/>
    </svg>
    <span>Deep's <em>Wiki</em></span>
  </a>
  <input id="search" class="search" type="search" placeholder="Search stories, ideas, situations…   ( / )">
  <button class="btn" onclick="surprise()">✧ Spark a thought</button>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script src="wiki-data.js"></script>
<script>
  const DATA = window.WIKI || {};
  const allPages = DATA.pages || [];
  // Story cards are the main unit; book pages ("the full story") are shown on each book's view
  const pages = allPages.filter(p => p.type !== "book");
  const bookPages = allPages.filter(p => p.type === "book");
  const library = DATA.library || [];
  const taxonomy = DATA.taxonomy || { situationGroups: [], concepts: [] };
  const shelves = [...new Set(library.map(b => b.category))];

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s).toLowerCase().replace(/^the\s+/, "").replace(/[^a-z0-9]/g, "");
  const pretty = slug => slug.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  const plural = (n, word) => n === 1 ? `1 ${word}` : `${n} ${word === "story" ? "stories" : word + "s"}`;
  const bookHref = title => `#/book/${encodeURIComponent(title)}`;
  const shelfHref = shelf => `#/shelf/${encodeURIComponent(shelf)}`;

  const labels = { situation: {}, concept: {} };
  taxonomy.situationGroups.forEach(g => g.items.forEach(i => labels.situation[i.slug] = i.label));
  taxonomy.concepts.forEach(c => labels.concept[c.slug] = c.label);
  const labelFor = (kind, slug) => labels[kind][slug] || pretty(slug);

  function findBook(name) {
    const n = norm(name);
    if (!n) return null;
    return library.find(b => norm(b.title) === n)
        || library.find(b => norm(b.title).startsWith(n) || n.startsWith(norm(b.title)));
  }
  const pagesForBook = title => pages.filter(p => findBook(p.book)?.title === title);
  const bookPageFor = title => bookPages.find(p => findBook(p.book)?.title === title);
  const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const jumpTo = id => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  const countFor = (field, slug) => pages.filter(p => p[field].includes(slug)).length;

  // Saved sidebar state (which tab, which groups are open)
  let ui = { tab: "books", open: {} };
  try { ui = Object.assign(ui, JSON.parse(localStorage.getItem("deep-wiki-ui") || "{}")); } catch (e) {}
  const saveUi = () => { try { localStorage.setItem("deep-wiki-ui", JSON.stringify(ui)); } catch (e) {} };
  const isOpen = (key, fallback) => key in ui.open ? ui.open[key] : fallback;

  let current = { kind: "", value: "" };

  // Resolve [[Name]] to a page, then a book, else mark as not written yet.
  function wikilink(name) {
    const page = pages.find(p => norm(p.title) === norm(name) || p.slug === name);
    if (page) return `<a class="wikilink" href="#/page/${page.slug}">${esc(name)}</a>`;
    const book = findBook(name);
    if (book) return `<a class="wikilink" href="${bookHref(book.title)}">${esc(name)}</a>`;
    return `<span class="wikilink missing" title="Not written yet">${esc(name)}</span>`;
  }

  // ---------- tiny markdown renderer ----------
  function inline(text) {
    let s = esc(text);
    s = s.replace(/\[\[([^\]]+)\]\]/g, (_, n) => wikilink(n.replace(/&#39;/g, "'").replace(/&amp;/g, "&")));
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    return s;
  }

  function renderMarkdown(md) {
    let html = "", list = false, para = [], section = "";
    const flushPara = () => {
      if (!para.length) return;
      const text = para.join(" ");
      const cls = text.startsWith("**One-line hook:**") ? "hook" : section === "aha prompt" ? "aha" : "";
      html += `<p${cls ? ` class="${cls}"` : ""}>${inline(text)}</p>`;
      para = [];
    };
    const closeList = () => { if (list) { html += "</ul>"; list = false; } };

    for (const raw of md.split(/\r?\n/)) {
      const line = raw.trimEnd();
      if (/^###\s/.test(line)) { flushPara(); closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; }
      else if (/^#\s/.test(line)) { flushPara(); closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; }
      else if (/^##\s/.test(line)) { flushPara(); closeList(); section = line.slice(3).trim().toLowerCase(); html += `<h2 id="sec-${slugify(section)}">${inline(line.slice(3))}</h2>`; }
      else if (/^[-*]\s/.test(line)) { flushPara(); if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(line.slice(2))}</li>`; }
      else if (/^>\s?/.test(line)) { flushPara(); closeList(); html += `<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`; }
      else if (!line.trim()) { flushPara(); closeList(); }
      else { closeList(); para.push(line.trim()); }
    }
    flushPara(); closeList();
    return html;
  }

  // ---------- main views ----------
  const card = p => `<a class="card" href="${p.type === "book" && findBook(p.book) ? bookHref(findBook(p.book).title) : `#/page/${p.slug}`}">
      <h4>${esc(p.title)}</h4>
      <p>${inline(p.hook || "")}</p>
      <div class="src">${esc(p.book || p.source)}</div>
    </a>`;
  const grid = (list, emptyMsg) => list.length
    ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">${emptyMsg}</div>`;

  // A few stories that change once a day
  function todaysPicks(n) {
    const day = new Date().toDateString();
    const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
    return [...pages].sort((a, b) => hash(a.slug + day) - hash(b.slug + day)).slice(0, n);
  }

  function viewHome() {
    const booksCovered = library.filter(b => pagesForBook(b.title).length).length;
    const shelfCards = shelves.map(shelf => {
      const books = library.filter(b => b.category === shelf);
      const stories = books.reduce((n, b) => n + pagesForBook(b.title).length, 0);
      return `<a class="shelf" href="${shelfHref(shelf)}">
        <h4>${esc(shelf)}</h4>
        <div class="meta">${plural(books.length, "book")} · ${stories ? `<b>${plural(stories, "story")}</b>` : "no stories yet"}</div>
      </a>`;
    }).join("");
    return `
      <div class="hero">
        <h1>What are you <em>thinking about</em> today?</h1>
        <p>Browse a shelf, pick a situation in the sidebar, or search. Every idea here comes from a book you've read.</p>
        <button class="btn" onclick="surprise()">✧ Spark a thought</button>
        <div class="stats">
          <div class="stat"><b>${pages.length}</b><span>Stories</span></div>
          <div class="stat"><b>${booksCovered}<span style="font-size:15px;color:var(--faint)"> / ${library.length}</span></b><span>Books covered</span></div>
          <div class="stat"><b>${new Set(pages.flatMap(p => p.concepts)).size}</b><span>Concepts</span></div>
        </div>
      </div>
      <h2 class="section-title">Today's picks</h2>
      <p class="page-sub">A few stories to revisit. They change each day.</p>
      ${grid(todaysPicks(6), "No stories yet.")}
      <h2 class="section-title">Shelves</h2>
      <p class="page-sub">Similar books, grouped together.</p>
      <div class="shelf-grid">${shelfCards}</div>`;
  }

  function viewShelf(shelf) {
    const books = library.filter(b => b.category === shelf);
    const withStories = books.filter(b => pagesForBook(b.title).length);
    const without = books.filter(b => !pagesForBook(b.title).length);
    return `<p class="eyebrow"><a href="#/">Shelves</a></p>
      <h1 class="page-title">${esc(shelf)}</h1>
      <p class="page-sub">${plural(books.length, "book")} · ${withStories.length} with stories so far</p>
      ${withStories.map(b => `<div class="book-block">
          <h3><a href="${bookHref(b.title)}" style="color:var(--text)">${esc(b.title)}</a></h3>
          <div class="author">${esc(b.author)}</div>
          ${grid(pagesForBook(b.title), "")}
        </div>`).join("")}
      ${without.length ? `<div class="not-yet"><b>Not written yet</b>${without.map(b =>
          `<a href="${bookHref(b.title)}">${esc(b.title)}</a>`).join(" · ")}</div>` : ""}`;
  }

  function viewBook(title) {
    const b = library.find(x => x.title === title);
    if (!b) return `<div class="empty">Book not found.</div>`;
    const list = pagesForBook(title);
    const full = bookPageFor(title);
    const header = `<p class="eyebrow"><a href="${shelfHref(b.category)}">${esc(b.category)}</a></p>
      <h1 class="page-title">${esc(b.title)}</h1>`;
    if (!full) return `${header}
      <p class="page-sub">${esc(b.author)} · ${plural(list.length, "story")}</p>
      ${grid(list, "No stories from this book yet. It's on the to-do list.")}`;
    const minutes = Math.max(1, Math.round(full.body.split(/\s+/).length / 230));
    const parts = [...full.body.matchAll(/^## (.+)$/gm)].map(m => m[1].trim());
    const toc = parts.map(t => `<button class="chip" onclick="jumpTo('sec-${slugify(t.toLowerCase())}')">${esc(t)}</button>`).join("")
      + (list.length ? `<button class="chip" onclick="jumpTo('book-stories')">Story cards (${list.length})</button>` : "");
    return `${header}
      <p class="page-sub">${esc(b.author)} · the full story, ${minutes} min read · ${plural(list.length, "story")}</p>
      <div class="meta-bar">
        <span class="badge ${full.verified ? "verified" : "unverified"}">${full.verified ? "✓ verified by Deep" : "○ not yet verified"}</span>
      </div>
      <div class="toc">${toc}</div>
      <article class="book-full">${renderMarkdown(full.body)}</article>
      <h2 class="section-title" id="book-stories">Story cards</h2>
      <p class="page-sub">Single stories from ${esc(b.title)}, each with its lesson and when to use it.</p>
      ${grid(list, "No stories from this book yet.")}`;
  }

  function viewPage(slug) {
    const p = pages.find(x => x.slug === slug);
    if (!p) return `<div class="empty">Page not found.</div>`;
    const book = findBook(p.book);
    const sameBook = book ? pagesForBook(book.title).filter(x => x !== p) : [];
    const connected = pages.filter(x => x !== p && !sameBook.includes(x) && (
      x.concepts.some(c => p.concepts.includes(c)) || x.situations.some(s => p.situations.includes(s))));
    return `
      ${book ? `<p class="eyebrow"><a href="${shelfHref(book.category)}">${esc(book.category)}</a> › <a href="${bookHref(book.title)}">${esc(book.title)}</a></p>` : ""}
      <div class="meta-bar">
        <span class="badge">${esc(p.source)}</span>
        <span class="badge ${p.verified ? "verified" : "unverified"}">${p.verified ? "✓ verified by Deep" : "○ not yet verified"}</span>
      </div>
      <article>
        ${renderMarkdown(p.body)}
        <div class="tags-block">
          <h5>Use it when</h5>
          ${p.situations.map(s => `<a class="chip" href="#/situation/${s}">${esc(labelFor("situation", s))}</a>`).join("")}
          <h5>Concepts</h5>
          ${p.concepts.map(c => `<a class="chip" href="#/concept/${c}">${esc(labelFor("concept", c))}</a>`).join("")}
        </div>
      </article>
      ${sameBook.length ? `<h2 class="section-title">More from ${esc(book.title)}</h2><p class="page-sub"></p>${grid(sameBook, "")}` : ""}
      ${connected.length ? `<h2 class="section-title">Connected stories</h2>
        <p class="page-sub">From other books, sharing a concept or situation.</p>${grid(connected, "")}` : ""}`;
  }

  function viewFilter(kind, value) {
    const list = pages.filter(p => p[kind === "situation" ? "situations" : "concepts"].includes(value));
    return `<p class="eyebrow">${kind === "situation" ? "I'm dealing with" : "Concept"}</p>
      <h1 class="page-title">${esc(labelFor(kind, value))}</h1>
      <p class="page-sub">${plural(list.length, "story")}</p>
      ${grid(list, "Nothing here yet.")}`;
  }

  function viewSearch(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const results = allPages.map(p => {
      const tags = [...p.situations.map(s => labelFor("situation", s)), ...p.concepts.map(c => labelFor("concept", c)), p.book]
        .join(" ").toLowerCase();
      let score = 0;
      for (const t of terms) {
        if (p.title.toLowerCase().includes(t)) score += 5;
        if (tags.includes(t)) score += 4;
        if (p.hook.toLowerCase().includes(t)) score += 3;
        if (p.body.toLowerCase().includes(t)) score += 1;
      }
      return { p, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).map(x => x.p);
    return `<p class="eyebrow">Search</p>
      <h1 class="page-title">“${esc(q)}”</h1>
      <p class="page-sub">${results.length} match${results.length === 1 ? "" : "es"}</p>
      ${grid(results, "No matches. Try words like “team”, “talent” or “practice”.")}`;
  }

  // ---------- sidebar ----------
  const isActive = (kind, value) => current.kind === kind && current.value === value;

  function groupHtml(key, title, count, defaultOpen, body) {
    const open = isOpen(key, defaultOpen);
    return `<div class="group">
      <button class="group-head ${open ? "open" : ""}" data-toggle="${esc(key)}">
        <span class="caret">▶</span>${esc(title)}<span class="count">${count || ""}</span>
      </button>
      ${open ? `<div class="group-body">${body()}</div>` : ""}
    </div>`;
  }

  function currentShelf() {
    if (current.kind === "shelf") return current.value;
    if (current.kind === "book") return findBook(current.value)?.category;
    if (current.kind === "page") return findBook(pages.find(p => p.slug === current.value)?.book || "")?.category;
    return null;
  }

  let bookQuery = "";

  function bookWithStories(b, showShelf) {
    const stories = pagesForBook(b.title);
    return `<a class="nav-item ${stories.length ? "" : "empty"} ${isActive("book", b.title) ? "active" : ""}" href="${bookHref(b.title)}">
        <span>${esc(b.title)}${showShelf ? `<span class="nav-shelf">${esc(b.author)} · ${esc(b.category)}</span>` : ""}</span>
        ${stories.length ? `<span class="count">${stories.length}</span>` : ""}</a>` +
      stories.map(p => `<a class="nav-item story ${isActive("page", p.slug) ? "active" : ""}" href="#/page/${p.slug}">${esc(p.title)}</a>`).join("");
  }

  function bookResults() {
    const q = bookQuery.trim().toLowerCase();
    if (q) {
      const hits = library.filter(b => `${b.title} ${b.author} ${b.category}`.toLowerCase().includes(q));
      return hits.length ? hits.map(b => bookWithStories(b, true)).join("")
                         : `<div class="empty">No book matches “${esc(bookQuery)}”.</div>`;
    }
    const here = currentShelf();
    return shelves.map(shelf => {
      const books = library.filter(b => b.category === shelf);
      const n = books.reduce((s, b) => s + pagesForBook(b.title).length, 0);
      return groupHtml(`shelf:${shelf}`, shelf, n, shelf === here, () => books.map(b => bookWithStories(b, false)).join(""));
    }).join("");
  }

  function booksTab() {
    return `<input id="book-search" class="book-search" type="search" placeholder="Find a book or author…" value="${esc(bookQuery)}">
      <div id="book-results">${bookResults()}</div>`;
  }

  function situationsTab() {
    const groups = taxonomy.situationGroups.map(g => {
      const items = g.items.map(i => ({ ...i, n: countFor("situations", i.slug) })).filter(i => i.n);
      if (!items.length) return "";
      const total = pages.filter(p => p.situations.some(s => items.some(i => i.slug === s))).length;
      return groupHtml(`sit:${g.name}`, g.name, total, true, () => items.map(i =>
        `<a class="nav-item ${isActive("situation", i.slug) ? "active" : ""}" href="#/situation/${i.slug}">${esc(i.label)}<span class="count">${i.n}</span></a>`).join(""));
    }).join("");
    return `<div class="side-note">Pick what's on your mind and get stories that help.</div>` + (groups || `<div class="empty">No situations yet.</div>`);
  }

  function conceptsTab() {
    const items = taxonomy.concepts.map(c => ({ ...c, n: countFor("concepts", c.slug) })).filter(c => c.n)
      .sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));
    return `<div class="side-note">Big ideas that run across your books.</div>` + (items.map(c =>
      `<a class="nav-item ${isActive("concept", c.slug) ? "active" : ""}" href="#/concept/${c.slug}">${esc(c.label)}<span class="count">${c.n}</span></a>`).join("")
      || `<div class="empty">No concepts yet.</div>`);
  }

  function renderSidebar() {
    const tabs = [["books", "Books"], ["situations", "I'm dealing with"], ["concepts", "Concepts"]];
    const body = { books: booksTab, situations: situationsTab, concepts: conceptsTab }[ui.tab] || booksTab;
    document.getElementById("sidebar").innerHTML =
      `<div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${ui.tab === k ? "active" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>` + body();
  }

  document.getElementById("sidebar").addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]");
    const toggle = e.target.closest("[data-toggle]");
    if (tab) { ui.tab = tab.dataset.tab; }
    else if (toggle) {
      const key = toggle.dataset.toggle;
      ui.open[key] = !toggle.classList.contains("open");
    } else return;
    saveUi();
    renderSidebar();
  });

  // Book search filters the list in place, so the input keeps focus while typing
  document.getElementById("sidebar").addEventListener("input", e => {
    if (e.target.id !== "book-search") return;
    bookQuery = e.target.value;
    document.getElementById("book-results").innerHTML = bookResults();
  });

  // ---------- router ----------
  function route() {
    const [, kind = "", ...rest] = (location.hash || "#/").split("/");
    current = { kind, value: decodeURIComponent(rest.join("/")) };
    const views = { page: viewPage, book: viewBook, shelf: viewShelf, search: viewSearch,
                    situation: v => viewFilter("situation", v), concept: v => viewFilter("concept", v) };
    document.getElementById("main").innerHTML = (views[kind] || viewHome)(current.value);
    // Keep the sidebar tab in step with where you navigated from
    if (kind === "situation" || kind === "concept") ui.tab = kind + "s";
    if (kind === "book" || kind === "shelf") ui.tab = "books";
    renderSidebar();
    window.scrollTo(0, 0);
  }

  function surprise() {
    if (!pages.length) return;
    const pool = pages.length > 1 ? pages.filter(p => p.slug !== current.value) : pages;
    location.hash = `#/page/${pool[Math.floor(Math.random() * pool.length)].slug}`;
  }

  const searchBox = document.getElementById("search");
  let timer;
  searchBox.addEventListener("input", () => {
    clearTimeout(timer);
    const q = searchBox.value.trim();
    timer = setTimeout(() => { location.hash = q ? `#/search/${encodeURIComponent(q)}` : "#/"; }, 200);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
  });

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
